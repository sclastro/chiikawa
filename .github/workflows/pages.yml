name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      # 目前的預設分支。GitHub Pages 的 github-pages environment 預設只准
      # 預設分支部署，所以兩條都接受，無論日後有沒有切換預設分支都部署得到。
      - claude/stoic-brahmagupta-8tdo0u
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # 群組含分支名：非預設分支的 run 不會取消預設分支上有效的 run。
  # 曾經因為共用一個 pages 群組，main 上注定失敗的 run 把預設分支上
  # 正常的 run 取消咗，結果整次部署冇發生。
  group: pages-${{ github.ref_name }}
  # 設為 true：新的部署有權中止仍在進行中的舊部署。
  # GitHub 的範本預設 false，但那會令一個卡住的 run 無限期霸佔隊列，
  # 令其後所有部署開不了。這個網站是純靜態站，中途中止沒有風險。
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # github-pages environment 只准預設分支部署。非預設分支的 push
    # 在此跳過（顯示為 skipped）而非失敗，毋須理會邊條分支係預設。
    if: github.ref_name == github.event.repository.default_branch
    # 純靜態站，正常兩分鐘內完成；設上限避免卡住的 run 長時間霸佔隊列。
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # 嘗試代為啟用 Pages。實測本 repo 的 GITHUB_TOKEN 權限不足
          # （Create Pages site failed: Resource not accessible by integration），
          # 所以首次仍須由 repo 擁有者到 Settings → Pages 手動啟用一次。
          # 保留此設定無害：Pages 一旦啟用，這裡只會讀取現有設定。
          enablement: true

      # 純靜態網站，無建置步驟，直接上傳整個 repo 根目錄
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
