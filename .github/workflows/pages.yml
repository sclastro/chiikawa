name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      # 目前的預設分支。GitHub Pages 的 github-pages environment 預設只准
      # 預設分支部署，所以兩條都接受，無論日後有沒有切換預設分支都部署得到。
      - claude/stoic-brahmagupta-8tdo0u
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # 若 repo 尚未啟用 Pages，由這個 action 代為啟用，
          # 省卻手動到 Settings → Pages 設定的一步。
          enablement: true

      # 純靜態網站，無建置步驟，直接上傳整個 repo 根目錄
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
