name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      # 目前的預設分支。GitHub Pages 的 github-pages environment 預設只准
      # 預設分支部署，所以兩條都接受，無論日後有沒有切換預設分支都部署得到。
      - claude/stoic-brahmagupta-8tdo0u
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # 設為 true：新的部署有權中止仍在進行中的舊部署。
  # GitHub 的範本預設 false，但那會令一個卡住的 run 無限期霸佔隊列，
  # 令其後所有部署開不了。這個網站是純靜態站，中途中止沒有風險。
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 純靜態站，正常兩分鐘內完成；設上限避免卡住的 run 長時間霸佔隊列。
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # 若 repo 尚未啟用 Pages，由這個 action 代為啟用，
          # 省卻手動到 Settings → Pages 設定的一步。
          enablement: true

      # 純靜態網站，無建置步驟，直接上傳整個 repo 根目錄
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
