<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF6EE">
<title>角色圖鑑 — 吉伊卡哇圖鑑</title>
<meta name="description" content="十六個《ちいかわ》角色的完整檔案：性格深度剖析、代表性名場面、關係網絡與人生參照。支援搜尋與多重篩選。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23F4CFC6'/%3E%3Cpath d='M16 25s-8-5.2-8-11.4A4.6 4.6 0 0 1 16 10a4.6 4.6 0 0 1 8 3.6C24 19.8 16 25 16 25z' fill='%23B45E2E'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&family=Nunito+Sans:wght@400;600;700;800&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/pages.css">
</head>
<body>
<a class="skip-link" href="#main">跳至主要內容</a>
<div data-nav></div>

<main id="main">
  <header class="page-head" style="--head-tint:var(--c-blush)">
    <div class="wrap">
      <span class="eyebrow">角色圖鑑</span>
      <h1>十六個角色，四種活法</h1>
      <p class="lede">
        每個角色都有基本檔案、性格剖析、代表名場面與關係網絡。
        可以用名字搜尋（中文或日文皆可），或按陣營、性格、篇章篩選。
      </p>
    </div>
  </header>

  <section class="wrap" style="padding-bottom:var(--s-7)">
    <div class="toolbar">
      <div class="search-box">
        <span class="search-box__icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        </span>
        <label class="visually-hidden" for="char-search">搜尋角色</label>
        <input type="search" id="char-search" placeholder="角色名、日文原名或關鍵字" autocomplete="off" enterkeyhint="search">
      </div>
      <button class="filter-btn" type="button" aria-expanded="false" aria-controls="filter-panel" data-filter-toggle>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
        篩選<span class="filter-btn__count" data-filter-count></span>
      </button>
    </div>

    <div class="filter-panel" id="filter-panel" hidden>
      <div class="chipset" data-filter="camp"><span class="chipset__label">陣營</span></div>
      <div class="chipset" data-filter="group"><span class="chipset__label">性格傾向</span></div>
      <div class="chipset" data-filter="arc"><span class="chipset__label">登場篇章</span></div>
    </div>

    <nav class="tier-jump" data-tier-jump aria-label="跳到角色分類"></nav>

    <div class="result-meta">
      <span data-count aria-live="polite"></span>
      <button class="linkish" type="button" data-reset hidden>清除所有條件</button>
    </div>

    <div data-results></div>
  </section>
</main>

<div data-footer></div>
<script src="data/characters.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/search.js"></script>
</body>
</html>
