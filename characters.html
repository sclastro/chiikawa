<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>角色圖鑑 — 吉伊卡哇圖鑑</title>
<meta name="description" content="十七個《ちいかわ》角色的完整檔案：性格深度剖析、代表性名場面、關係網絡與人生參照。支援搜尋與多重篩選。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23F4CFC6'/%3E%3Cpath d='M16 25s-8-5.2-8-11.4A4.6 4.6 0 0 1 16 10a4.6 4.6 0 0 1 8 3.6C24 19.8 16 25 16 25z' fill='%23B45E2E'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Varela+Round&family=Nunito+Sans:wght@300;400;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/pages.css">
</head>
<body>
<a class="skip-link" href="#main">跳至主要內容</a>
<div data-nav></div>

<main id="main">
  <section class="section" style="padding-bottom:var(--s-5)">
    <div class="wrap">
      <div class="section-head">
        <span class="eyebrow">角色圖鑑</span>
        <h1>十七個角色，四種活法</h1>
        <p>
          每個角色都有基本檔案、性格深度剖析、代表性名場面與關係網絡。
          點擊卡片進入詳情頁。可以用名字搜尋（中文或日文皆可），或者用下面的條件篩選。
        </p>
      </div>

      <div class="filters">
        <div class="search-box">
          <span class="search-box__icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          </span>
          <label class="visually-hidden" for="char-search">搜尋角色</label>
          <input type="search" id="char-search" placeholder="搜尋角色名、日文原名或關鍵字⋯⋯" autocomplete="off">
        </div>
        <div class="chipset" data-filter="camp"><span class="chipset__label">陣營</span></div>
        <div class="chipset" data-filter="group"><span class="chipset__label">性格傾向</span></div>
        <div class="chipset" data-filter="arc"><span class="chipset__label">登場篇章</span></div>
        <div>
          <button class="btn btn--ghost" type="button" data-reset>清除所有條件</button>
          <span style="margin-left:var(--s-3);font-size:var(--t-small);color:var(--c-ink-soft)" data-count aria-live="polite"></span>
        </div>
      </div>
    </div>
  </section>

  <section class="section" style="padding-top:0">
    <div class="wrap">
      <div data-results></div>
    </div>
  </section>
</main>

<div data-footer></div>
<script src="data/characters.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/search.js"></script>
</body>
</html>
